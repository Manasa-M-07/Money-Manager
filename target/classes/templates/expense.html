<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: html_head('Expense Management')}"></head>
<body>

    <div class="container-fluid">
        <div class="row">
            
            <!-- Sidebar -->
            <div th:replace="~{layout :: sidebar('expense')}"></div>
            
            <!-- Main Content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                
                <!-- Navbar -->
                <div th:replace="~{layout :: navbar}"></div>
                
                <!-- Notifications / Warnings -->
                <div class="mt-4">
                    <div th:if="${success}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
                        <i class="bi bi-check-circle-fill me-2"></i>
                        <span th:text="${success}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                    
                    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
                        <i class="bi bi-exclamation-circle-fill me-2"></i>
                        <span th:text="${error}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <div th:if="${warning}" class="alert alert-warning alert-dismissible fade show shadow-sm" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <strong>Budget Warning:</strong> <span th:text="${warning}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                </div>

                <!-- Page Title & Actions -->
                <div class="d-flex justify-content-between align-items-center my-4">
                    <div>
                        <h2 class="fw-bold mb-1">Expense Management</h2>
                        <p class="text-muted mb-0">Track and manage your daily expenditure</p>
                    </div>
                    <button class="btn btn-primary px-4 py-2 fw-semibold" data-bs-toggle="modal" data-bs-target="#addExpenseModal">
                        <i class="bi bi-plus-lg me-1"></i> Add Expense
                    </button>
                </div>

                <!-- Expense History Card -->
                <div class="card border-0 shadow-sm p-4 bg-white">
                    <h5 class="fw-bold mb-4">Expense History</h5>
                    
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Category</th>
                                    <th>Description</th>
                                    <th>Amount</th>
                                    <th class="text-end">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="exp : ${expenses}">
                                    <td th:text="${exp.date}">2026-07-10</td>
                                    <td>
                                        <span class="badge bg-light text-dark border px-3 py-2 rounded-pill fw-medium" th:text="${exp.category}">Food</span>
                                    </td>
                                    <td th:text="${exp.description != null && !exp.description.isEmpty() ? exp.description : 'N/A'}">Groceries</td>
                                    <td class="text-danger fw-bold" th:text="'-₹' + ${#numbers.formatDecimal(exp.amount, 1, 2)}">-₹0.00</td>
                                    <td class="text-end">
                                        <button class="btn btn-sm btn-outline-secondary me-1 edit-expense-btn"
                                                th:data-id="${exp.id}"
                                                th:data-amount="${exp.amount}"
                                                th:data-category="${exp.category}"
                                                th:data-date="${exp.date}"
                                                th:data-description="${exp.description}"
                                                data-bs-toggle="modal" data-bs-target="#editExpenseModal">
                                            <i class="bi bi-pencil-square"></i>
                                        </button>
                                        <a th:href="@{/dashboard/expense/delete/{id}(id=${exp.id})}" class="btn btn-sm btn-outline-danger"
                                           onclick="return confirm('Are you sure you want to delete this expense record?');">
                                            <i class="bi bi-trash"></i>
                                        </a>
                                    </td>
                                </tr>
                                <tr th:if="${expenses.isEmpty()}">
                                    <td colspan="5" class="text-center text-muted py-4">No expense records found. Click "Add Expense" to start tracking!</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <!-- ADD EXPENSE MODAL -->
    <div class="modal fade" id="addExpenseModal" tabindex="-1" aria-labelledby="addExpenseModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title fw-bold" id="addExpenseModalLabel">Add Expense Record</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form th:action="@{/dashboard/expense/add}" th:object="${newExpense}" method="POST">
                    <div class="modal-body p-4">
                        <div class="mb-3">
                            <label for="addAmount" class="form-label">Amount (₹)</label>
                            <input type="number" step="0.01" class="form-control" id="addAmount" th:field="*{amount}" required placeholder="0.00" min="0.01">
                        </div>
                        <div class="mb-3">
                            <label for="addCategory" class="form-label">Category</label>
                            <select class="form-select" id="addCategory" th:field="*{category}" required>
                                <option value="" disabled selected>Select Category</option>
                                <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="addDate" class="form-label">Date</label>
                            <input type="date" class="form-control" id="addDate" th:field="*{date}" required>
                        </div>
                        <div class="mb-0">
                            <label for="addDesc" class="form-label">Description (Optional)</label>
                            <textarea class="form-control" id="addDesc" th:field="*{description}" rows="3" placeholder="e.g. Weekly grocery shopping at Walmart"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer border-0 px-4 pb-4">
                        <button type="button" class="btn btn-outline-secondary px-3" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary px-4">Save Expense</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- EDIT EXPENSE MODAL -->
    <div class="modal fade" id="editExpenseModal" tabindex="-1" aria-labelledby="editExpenseModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title fw-bold" id="editExpenseModalLabel">Edit Expense Record</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form th:action="@{/dashboard/expense/edit}" method="POST">
                    <input type="hidden" id="editId" name="id">
                    <div class="modal-body p-4">
                        <div class="mb-3">
                            <label for="editAmount" class="form-label">Amount (₹)</label>
                            <input type="number" step="0.01" class="form-control" id="editAmount" name="amount" required placeholder="0.00" min="0.01">
                        </div>
                        <div class="mb-3">
                            <label for="editCategory" class="form-label">Category</label>
                            <select class="form-select" id="editCategory" name="category" required>
                                <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="editDate" class="form-label">Date</label>
                            <input type="date" class="form-control" id="editDate" name="date" required>
                        </div>
                        <div class="mb-0">
                            <label for="editDesc" class="form-label">Description (Optional)</label>
                            <textarea class="form-control" id="editDesc" name="description" rows="3" placeholder="e.g. Description of expense"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer border-0 px-4 pb-4">
                        <button type="button" class="btn btn-outline-secondary px-3" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-dark px-4">Update Record</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div th:replace="~{layout :: footer_scripts}"></div>
    
    <!-- Script to populate edit modal data dynamically -->
    <script>
        document.querySelectorAll('.edit-expense-btn').forEach(button => {
            button.addEventListener('click', function() {
                document.getElementById('editId').value = this.getAttribute('data-id');
                document.getElementById('editAmount').value = this.getAttribute('data-amount');
                document.getElementById('editCategory').value = this.getAttribute('data-category');
                document.getElementById('editDate').value = this.getAttribute('data-date');
                document.getElementById('editDesc').value = this.getAttribute('data-description');
            });
        });

        // Auto set current date to add form
        document.getElementById('addExpenseModal').addEventListener('show.bs.modal', function () {
            if(!document.getElementById('addDate').value) {
                document.getElementById('addDate').value = new Date().toISOString().substring(0, 10);
            }
        });
    </script>
</body>
</html>
