<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: html_head('User Profile')}"></head>
<body>

    <div class="container-fluid">
        <div class="row">
            
            <!-- Sidebar -->
            <div th:replace="~{layout :: sidebar('profile')}"></div>
            
            <!-- Main Content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                
                <!-- Navbar -->
                <div th:replace="~{layout :: navbar}"></div>
                
                <!-- Notifications -->
                <div class="mt-4">
                    <div th:if="${success}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
                        <i class="bi bi-check-circle-fill me-2"></i>
                        <span th:text="${success}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                    
                    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
                        <i class="bi bi-exclamation-circle-fill me-2"></i>
                        <span th:text="${error}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                </div>

                <!-- Page Title -->
                <div class="my-4">
                    <h2 class="fw-bold mb-1">My Profile</h2>
                    <p class="text-muted mb-0">Manage your account information, profile avatar, and credentials</p>
                </div>

                <div class="row g-4">
                    
                    <!-- Left: Profile Info & Avatar -->
                    <div class="col-lg-7">
                        
                        <!-- Profile Pic Widget -->
                        <div class="card border-0 shadow-sm p-4 bg-white mb-4 text-center">
                            <div class="profile-pic-container mb-3">
                                <img th:src="${session.user.profilePicture != null ? session.user.profilePicture : 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80'}" 
                                     alt="Profile Avatar" class="profile-pic-preview">
                            </div>
                            
                            <form th:action="@{/dashboard/profile/picture}" method="POST" enctype="multipart/form-data" class="max-width-xs mx-auto">
                                <div class="mb-3">
                                    <input class="form-control form-control-sm" type="file" id="profilePic" name="profilePic" accept="image/*" required>
                                </div>
                                <button type="submit" class="btn btn-sm btn-outline-primary px-4 fw-semibold">Upload Photo</button>
                            </form>
                        </div>

                        <!-- Profile details form -->
                        <div class="card border-0 shadow-sm p-4 bg-white">
                            <h5 class="fw-bold mb-4">Personal Details</h5>
                            
                            <form th:action="@{/dashboard/profile/update}" method="POST">
                                <div class="mb-3">
                                    <label for="name" class="form-label">Full Name</label>
                                    <input type="text" class="form-control" id="name" name="name" th:value="${session.user.name}" required>
                                </div>
                                <div class="mb-3">
                                    <label for="email" class="form-label">Email Address</label>
                                    <input type="email" class="form-control" id="email" name="email" th:value="${session.user.email}" required>
                                </div>
                                <div class="mb-4">
                                    <label for="phone" class="form-label">Phone Number</label>
                                    <input type="text" class="form-control" id="phone" name="phone" th:value="${session.user.phone}">
                                </div>
                                <button type="submit" class="btn btn-primary px-5 py-2 fw-semibold">Save Details</button>
                            </form>
                        </div>
                    </div>

                    <!-- Right: Security & Password Update -->
                    <div class="col-lg-5">
                        <div class="card border-0 shadow-sm p-4 bg-white h-100">
                            <h5 class="fw-bold mb-4">Security Settings</h5>
                            
                            <form th:action="@{/dashboard/profile/password}" method="POST" onsubmit="return validatePasswords();">
                                <div class="mb-3">
                                    <label for="currentPassword" class="form-label">Current Password</label>
                                    <input type="password" class="form-control" id="currentPassword" name="currentPassword" required placeholder="Enter current password">
                                </div>
                                <div class="mb-3">
                                    <label for="newPassword" class="form-label">New Password</label>
                                    <input type="password" class="form-control" id="newPassword" name="newPassword" required placeholder="Enter new password">
                                </div>
                                <div class="mb-4">
                                    <label for="confirmPassword" class="form-label">Confirm New Password</label>
                                    <input type="password" class="form-control" id="confirmPassword" required placeholder="Confirm new password">
                                    <div class="text-danger small mt-1" id="pw-error" style="display:none;">New passwords do not match!</div>
                                </div>
                                <button type="submit" class="btn btn-dark w-100 py-3 fw-bold">Update Password</button>
                            </form>
                        </div>
                    </div>

                </div>

            </main>
        </div>
    </div>

    <div th:replace="~{layout :: footer_scripts}"></div>
    
    <script>
        function validatePasswords() {
            var newPw = document.getElementById('newPassword').value;
            var confirmPw = document.getElementById('confirmPassword').value;
            var err = document.getElementById('pw-error');
            
            if (newPw !== confirmPw) {
                err.style.display = 'block';
                return false;
            }
            err.style.display = 'none';
            return true;
        }
    </script>
</body>
</html>
