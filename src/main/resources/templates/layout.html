<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="html_head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - Money Manager'"></title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/custom.css">
</head>
<body>

    <!-- Sidebar Fragment -->
    <div th:fragment="sidebar(activeTab)" class="sidebar col-md-3 col-lg-2 d-md-block collapse p-3">
        <div class="d-flex align-items-center mb-4 text-white text-decoration-none">
            <span class="fs-4 fw-bold text-white"><i class="bi bi-wallet2 me-2"></i>MoneyManager</span>
        </div>
        <hr class="text-secondary">
        
        <ul class="nav nav-pills flex-column mb-auto">
            <!-- User links -->
            <li th:if="${session.user.role == 'USER'}">
                <a href="/dashboard" class="nav-link" th:classappend="${activeTab == 'dashboard'} ? 'active' : ''">
                    <i class="bi bi-speedometer2 me-2"></i> Dashboard
                </a>
            </li>
            <li th:if="${session.user.role == 'USER'}">
                <a href="/dashboard/income" class="nav-link" th:classappend="${activeTab == 'income'} ? 'active' : ''">
                    <i class="bi bi-graph-up-arrow me-2"></i> Income
                </a>
            </li>
            <li th:if="${session.user.role == 'USER'}">
                <a href="/dashboard/expense" class="nav-link" th:classappend="${activeTab == 'expense'} ? 'active' : ''">
                    <i class="bi bi-graph-down-arrow me-2"></i> Expenses
                </a>
            </li>
            <li th:if="${session.user.role == 'USER'}">
                <a href="/dashboard/budget" class="nav-link" th:classappend="${activeTab == 'budget'} ? 'active' : ''">
                    <i class="bi bi-sliders me-2"></i> Budgets
                </a>
            </li>
            <li th:if="${session.user.role == 'USER'}">
                <a href="/dashboard/reports" class="nav-link" th:classappend="${activeTab == 'reports'} ? 'active' : ''">
                    <i class="bi bi-file-earmark-bar-graph me-2"></i> Reports
                </a>
            </li>
            <li th:if="${session.user.role == 'USER'}">
                <a href="/dashboard/profile" class="nav-link" th:classappend="${activeTab == 'profile'} ? 'active' : ''">
                    <i class="bi bi-person-circle me-2"></i> Profile
                </a>
            </li>

            <!-- Admin links -->
            <li th:if="${session.user.role == 'ADMIN'}">
                <a href="/admin/dashboard" class="nav-link" th:classappend="${activeTab == 'admin-dashboard'} ? 'active' : ''">
                    <i class="bi bi-speedometer2 me-2"></i> Admin Panel
                </a>
            </li>
        </ul>
        <hr class="text-secondary">
        <div class="dropdown">
            <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle" id="dropdownUser1" data-bs-toggle="dropdown" aria-expanded="false">
                <img th:src="${session.user.profilePicture != null ? session.user.profilePicture : 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80'}" alt="" width="32" height="32" class="rounded-circle me-2">
                <strong th:text="${session.user.name}">User</strong>
            </a>
            <ul class="dropdown-menu dropdown-menu-dark text-small shadow" aria-labelledby="dropdownUser1">
                <li th:if="${session.user.role == 'USER'}"><a class="dropdown-menu-item dropdown-item" href="/dashboard/profile">Profile</a></li>
                <li><hr class="dropdown-divider"></li>
                <li><a class="dropdown-item" href="/logout">Sign out</a></li>
            </ul>
        </div>
    </div>

    <!-- Top Navigation Fragment -->
    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-light bg-white border-bottom py-3 px-4">
        <div class="container-fluid">
            <button class="navbar-toggler d-md-none" type="button" data-bs-toggle="collapse" data-bs-target=".sidebar" aria-controls="sidebar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="d-flex ms-auto align-items-center">
                <div class="me-3 text-end d-none d-sm-block">
                    <span class="text-muted d-block small">Logged in as</span>
                    <span class="fw-semibold" th:text="${session.user.name}">User Name</span>
                </div>
                <div class="flex-shrink-0 dropdown">
                    <a href="#" class="d-block link-dark text-decoration-none dropdown-toggle" id="dropdownUser2" data-bs-toggle="dropdown" aria-expanded="false">
                        <img th:src="${session.user.profilePicture != null ? session.user.profilePicture : 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80'}" alt="mdo" width="40" height="40" class="rounded-circle border border-2 border-primary-light">
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end text-small shadow" aria-labelledby="dropdownUser2">
                        <li th:if="${session.user.role == 'USER'}"><a class="dropdown-item" href="/dashboard/profile">Profile</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="/logout">Sign out</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <!-- Footer Scripts Fragment -->
    <div th:fragment="footer_scripts">
        <!-- Bootstrap 5 Bundle JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <!-- Chart.js for dashboard charts -->
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    </div>

</body>
</html>
